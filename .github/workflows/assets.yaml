---
name: assets
on:
  release:
    types:
      - created
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to checkout'
        required: true
        type: string
env:
  # e.g. v1.0.0 (use release tag on release events or the provided tag on manual invocation)
  TAG_NAME: ${{ github.event.release.tag_name || github.event.inputs.tag }}

permissions: {}

jobs:
  proto-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Init submodule
        run: git submodule init && git submodule update
      - name: Set raw version
        id: raw_tag
        # Strips the 'v' from the actual semver version.
        run: echo "raw_version=${TAG_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Install Protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
      - name: Compile proto release assets
        env:
          RAW_VERSION: ${{ steps.raw_tag.outputs.raw_version }}
        run: go run ./util/cmd/release -version="$RAW_VERSION"
      - name: Upload proto release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG_NAME" ./dist/* --clobber
  binary-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [proto-assets]
    strategy:
      matrix:
        osarch:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: windows
            arch: amd64
    steps:
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set raw version
        id: raw_tag
        # Strips the 'v' from the actual semver version.
        run: echo "raw_version=${TAG_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Build for the ${{ matrix.osarch.os }}/${{ matrix.osarch.arch }} platform.
        env:
          TARGET_OS: ${{ matrix.osarch.os }}
          TARGET_ARCH: ${{ matrix.osarch.arch }}
        run: |
          BIN_NAME="gapic-showcase"
          if [ "$TARGET_OS" = "windows" ]; then
            BIN_NAME="gapic-showcase.exe"
          fi
          GOOS="$TARGET_OS" GOARCH="$TARGET_ARCH" CGO_ENABLED=0 go build -trimpath -o "$BIN_NAME" ./cmd/gapic-showcase
          tar cvfz gapic-showcase.tar.gz "$BIN_NAME"
      - name: Upload the ${{ matrix.osarch.os }}/${{ matrix.osarch.arch }} release.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RAW_VERSION: ${{ steps.raw_tag.outputs.raw_version }}
          TARGET_OS: ${{ matrix.osarch.os }}
          TARGET_ARCH: ${{ matrix.osarch.arch }}
        run: |
          ASSET_NAME="gapic-showcase-${RAW_VERSION}-${TARGET_OS}-${TARGET_ARCH}.tar.gz"
          mv gapic-showcase.tar.gz "${ASSET_NAME}"
          gh release upload "$TAG_NAME" "${ASSET_NAME}" --clobber
